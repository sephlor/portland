name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Rust version
        run: rustc --version

      - name: Build
        run: |
          rustc --crate-type=lib libs.rs
          rustc --crate-type=lib --out-dir=other_libs other_libs/other_libs.rs
          rustc -o main_split_with_libs split.rs --extern other_libs=other_libs/libother_libs.rlib

      - name: Run
        run: ./main_split_with_libs
